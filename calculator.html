<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JavaScript Calculator</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0b0b0d;
        color: #f2f2f3;
        font-family: Arial, sans-serif;
        padding: 20px;
      }
      .calculator {
        width: min(340px, 100%);
        padding: 22px;
        border: 1px solid #303036;
        border-radius: 12px;
        background: #111114;
      }
      a {
        color: #aaaab2;
        font-size: 13px;
        text-decoration: none;
      }
      h1 {
        font-size: 22px;
      }
      #display {
        width: 100%;
        height: 75px;
        margin: 12px 0 18px;
        background: #09090b;
        color: white;
        border: 1px solid #303036;
        border-radius: 7px;
        text-align: right;
        padding: 12px;
        font-size: 27px;
      }
      .keys {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
      }
      button {
        min-height: 53px;
        border: 1px solid #303036;
        border-radius: 6px;
        background: #202024;
        color: white;
        font-size: 17px;
        cursor: pointer;
      }
      button:hover {
        background: #38383f;
      }
      .operator {
        background: #303036;
      }
      .equals {
        background: #ededee;
        color: #111114;
      }
      .clear {
        color: #e0b4b4;
      }
    </style>
  </head>
  <body>
    <main class="calculator">
      <a href="index.html">← Kembali ke portofolio</a>
      <h1>JavaScript Calculator</h1>
      <input id="display" value="0" readonly aria-label="Hasil kalkulator" />
      <div class="keys">
        <button class="clear" data-action="clear">AC</button>
        <button data-action="delete">DEL</button>
        <button class="operator" data-value="%">%</button>
        <button class="operator" data-value="/">÷</button>
        <button data-value="7">7</button><button data-value="8">8</button>
        <button data-value="9">9</button
        ><button class="operator" data-value="*">×</button>
        <button data-value="4">4</button><button data-value="5">5</button>
        <button data-value="6">6</button
        ><button class="operator" data-value="-">−</button>
        <button data-value="1">1</button><button data-value="2">2</button>
        <button data-value="3">3</button
        ><button class="operator" data-value="+">+</button>
        <button data-value="0">0</button><button data-value=".">.</button>
        <button data-action="sign">±</button
        ><button class="equals" data-action="equals">=</button>
      </div>
    </main>

    <script>
      const display = document.querySelector("#display");
      let expression = "";
      let finished = false;

      function show() {
        display.value = expression || "0";
      }

      document.querySelector(".keys").addEventListener("click", (event) => {
        const button = event.target.closest("button");
        if (!button) return;

        const value = button.dataset.value;
        const action = button.dataset.action;

        if (action === "clear") {
          expression = "";
        } else if (action === "delete") {
          expression = expression.slice(0, -1);
        } else if (action === "sign") {
          const match = expression.match(/(\d*\.?\d+)$/);
          if (match) {
            const start = match.index;
            const number = match[0];
            const before = expression.slice(0, start);
            expression =
              before +
              (before.endsWith("(-") ? number + ")" : "(-" + number + ")");
          }
        } else if (action === "equals") {
          try {
            if (!expression || !/^[\d+\-*/%.() ]+$/.test(expression)) {
              throw new Error("Input tidak valid");
            }
            const result = Function(
              '"use strict"; return (' + expression + ")",
            )();
            if (!Number.isFinite(result)) throw new Error("Hasil tidak valid");
            expression = String(Number(result.toPrecision(12)));
            finished = true;
          } catch {
            display.value = "Error";
            expression = "";
            return;
          }
        } else if (value !== undefined) {
          if (finished && /[\d.]/.test(value)) expression = "";
          finished = false;
          if (value === ".") {
            const lastNumber = expression.split(/[+\-*/%()]/).pop();
            if (lastNumber.includes(".")) return;
          }
          expression += value;
        }

        show();
      });
    </script>
  </body>
</html>
